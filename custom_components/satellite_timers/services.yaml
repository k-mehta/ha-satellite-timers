start_timer:
  name: Start timer
  description: Start a timer on a satellite by name and duration. Returns the timer's state, including the sensor entity id to bind the card to.
  fields:
    command_id:
      name: Command ID
      description: A UUID v4 that makes the call idempotent — retrying with the same command_id returns the stored result instead of starting a second timer.
      required: true
      example: "123e4567-e89b-42d3-a456-426614174000"
    name:
      name: Name
      description: The timer's display name. A recipe chip passes the recipe name.
      required: true
      example: "Pasta"
    duration_seconds:
      name: Duration
      description: How long the timer runs, in seconds (1 to 86400).
      required: true
      example: 600
    device_id:
      name: Satellite
      description: The satellite device id or assist_satellite entity id. Omit to use the primary satellite, or the single configured satellite.
      required: false
      example: "assist_satellite.kitchen"
pause_timer:
  name: Pause timer
  description: Pause a running timer. A timer in any other state returns its current state unchanged.
  fields:
    command_id:
      name: Command ID
      description: A UUID v4 that makes the call idempotent.
      required: true
      example: "123e4567-e89b-42d3-a456-426614174000"
    timer_id:
      name: Timer ID
      description: The timer_id attribute of the bridge sensor for the timer.
      required: true
      example: "01K8..."
resume_timer:
  name: Resume timer
  description: Resume a paused timer. A timer in any other state returns its current state unchanged.
  fields:
    command_id:
      name: Command ID
      description: A UUID v4 that makes the call idempotent.
      required: true
      example: "123e4567-e89b-42d3-a456-426614174000"
    timer_id:
      name: Timer ID
      description: The timer_id attribute of the bridge sensor for the timer.
      required: true
      example: "01K8..."
cancel_timer:
  name: Cancel timer
  description: Cancel a running or paused timer. The bridge sensor disappears, and the cancel can be undone for 5 seconds with undo_remove.
  fields:
    command_id:
      name: Command ID
      description: A UUID v4 that makes the call idempotent.
      required: true
      example: "123e4567-e89b-42d3-a456-426614174000"
    timer_id:
      name: Timer ID
      description: The timer_id attribute of the bridge sensor for the timer.
      required: true
      example: "01K8..."
dismiss_timer:
  name: Dismiss timer
  description: Clear a finished timer. The bridge sensor disappears, and the dismiss can be undone for 5 seconds with undo_remove. A timer that is still running cannot be dismissed; cancel it instead.
  fields:
    command_id:
      name: Command ID
      description: A UUID v4 that makes the call idempotent.
      required: true
      example: "123e4567-e89b-42d3-a456-426614174000"
    timer_id:
      name: Timer ID
      description: The timer_id attribute of the bridge sensor for the timer.
      required: true
      example: "01K8..."
acknowledge_timer:
  name: Acknowledge timer
  description: Stop a ringing timer. The timer stays as a finished timer until it is dismissed.
  fields:
    command_id:
      name: Command ID
      description: A UUID v4 that makes the call idempotent.
      required: true
      example: "123e4567-e89b-42d3-a456-426614174000"
    timer_id:
      name: Timer ID
      description: The timer_id attribute of the bridge sensor for the timer.
      required: true
      example: "01K8..."
restart_timer:
  name: Restart timer
  description: Start a finished timer again, for its full original duration, as a new timer.
  fields:
    command_id:
      name: Command ID
      description: A UUID v4 that makes the call idempotent.
      required: true
      example: "123e4567-e89b-42d3-a456-426614174000"
    timer_id:
      name: Timer ID
      description: The timer_id attribute of the bridge sensor for the timer.
      required: true
      example: "01K8..."
add_time:
  name: Add time
  description: Add time to a running or paused timer. A negative number removes time instead. A timer in any other state returns its current state unchanged.
  fields:
    command_id:
      name: Command ID
      description: A UUID v4 that makes the call idempotent.
      required: true
      example: "123e4567-e89b-42d3-a456-426614174000"
    timer_id:
      name: Timer ID
      description: The timer_id attribute of the bridge sensor for the timer.
      required: true
      example: "01K8..."
    seconds:
      name: Seconds
      description: Seconds to add (negative to remove).
      required: true
      example: 60
undo_remove:
  name: Undo remove
  description: Put a timer cancelled or dismissed within the last 5 seconds back exactly as it was — same timer, same state, same time left. After 5 seconds the undo is gone.
  fields:
    command_id:
      name: Command ID
      description: A UUID v4 that makes the call idempotent.
      required: true
      example: "123e4567-e89b-42d3-a456-426614174000"
    timer_id:
      name: Timer ID
      description: The timer_id of the timer that was cancelled or dismissed.
      required: true
      example: "01K8..."
ring_started:
  name: Ring started
  description: Called by the announcement automation when a finished timer's ring starts playing. Confirms the ring reached the satellite; without it, the bridge records the ring as missed after 5 seconds.
  fields:
    timer_id:
      name: Timer ID
      description: The timer_id attribute of the bridge sensor for the timer.
      required: true
      example: "01K8..."
    command_id:
      name: Command ID
      description: A UUID v4, when the caller has one. When omitted, the bridge generates one and returns it.
      required: false
      example: "123e4567-e89b-42d3-a456-426614174000"
