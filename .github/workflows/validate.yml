name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  hassfest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

  validate-hacs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # No brand icon/logo yet (see BEST_PRACTICES.md): skip brand
          # validation until the integration is submitted to
          # home-assistant/brands. Topics and images are also skipped:
          # this is a custom HACS repo, not a default-store listing,
          # so repo topics are optional, and the README's only images
          # are CI badges.
          ignore: brands topics images
